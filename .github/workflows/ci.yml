# ============================================================
# CSM — CI matrix (Postgres + MySQL)
# ============================================================
#
# Triggers: push a main, PRs.
# Jobs:
#   - lint+typecheck (única vez)
#   - unit tests (única vez — sin BD)
#   - integration tests × matrix [postgres, mysql]
#
# Cada job de integración levanta su BD via `services` (GitHub Actions hace
# pull de la imagen y la deja accesible en `127.0.0.1:<port>`).
# El test runner ve `DATABASE_URL` apuntando al service container.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ------------------------------------------------------------
  # Lint + typecheck — barato, falla rápido
  # ------------------------------------------------------------
  static:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck

  # ------------------------------------------------------------
  # Unit tests — sin BD, deterministas
  # ------------------------------------------------------------
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  # ------------------------------------------------------------
  # Build — verifica que `next build` compila con el schema activo
  # ------------------------------------------------------------
  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          # Dummies para que t3-env no falle. Sin DATABASE_URL real, las
          # features dependientes de DB se desactivan a runtime.
          AUTH_SECRET: dev-secret-for-ci-only-please-please-please
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SKIP_ENV_VALIDATION: "true"

  # ------------------------------------------------------------
  # Integration matrix — Postgres + MySQL
  # ------------------------------------------------------------
  integration:
    name: Integration (${{ matrix.dialect }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Postgres 16 + pgvector. Imagen ankane/pgvector ya trae extension.
          - dialect: postgres
            image: ankane/pgvector:latest
            port: 5432
            db_url: postgres://csm:csm@127.0.0.1:5432/csm
            health_cmd: pg_isready -U csm

          # MySQL 8.4 (mainstream LTS). Para MySQL 9+ test cuando vector
          # search nativo esté disponible: usar mysql:9.0
          - dialect: mysql
            image: mysql:8.4
            port: 3306
            db_url: mysql://csm:csm@127.0.0.1:3306/csm
            health_cmd: mysqladmin ping -h localhost -u csm -pcsm

    services:
      db:
        image: ${{ matrix.image }}
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        env:
          # Postgres
          POSTGRES_USER: csm
          POSTGRES_PASSWORD: csm
          POSTGRES_DB: csm
          # MySQL
          MYSQL_USER: csm
          MYSQL_PASSWORD: csm
          MYSQL_DATABASE: csm
          MYSQL_ROOT_PASSWORD: csm
        options: >-
          --health-cmd="${{ matrix.health_cmd }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=30s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      # Postgres: instalar extensions necesarias (pgvector ya viene en la imagen).
      - name: Setup Postgres extensions
        if: matrix.dialect == 'postgres'
        run: |
          PGPASSWORD=csm psql -h 127.0.0.1 -U csm -d csm \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      # Drizzle push: sincroniza schema con la BD vacía.
      - name: Push schema (${{ matrix.dialect }})
        env:
          DATABASE_URL: ${{ matrix.db_url }}
          AUTH_SECRET: dev-secret-for-ci-only-please-please-please
          SKIP_ENV_VALIDATION: "true"
        run: npm run db:push -- --force || echo "schema push warnings"

      # Tests de integración (los que usen DATABASE_URL real).
      - name: Integration tests
        env:
          DATABASE_URL: ${{ matrix.db_url }}
          REDIS_URL: redis://127.0.0.1:6379
          AUTH_SECRET: dev-secret-for-ci-only-please-please-please
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SKIP_ENV_VALIDATION: "true"
        run: npm test
